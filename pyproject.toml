[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instinct-npc"
version = "0.1.0"
description = "NPC decisions that learn the player, fast enough to run in a game loop. Built on TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.5"]

[project.optional-dependencies]
trace = ["weave"]
dev = ["pytest"]

[tool.setuptools]
packages = ["instinct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
